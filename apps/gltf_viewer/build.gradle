plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "fhuyakou.godot.app.android.gltfviewer"
    compileSdk versions.compileSdk

    defaultConfig {
        // The default ignore pattern for the 'assets' directory includes hidden files and
        // directories which are used by Godot projects, so we override it with the following.
        aaptOptions {
            ignoreAssetsPattern "!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
        }

        applicationId = "fhuyakou.godot.app.android.gltfviewer"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility = versions.javaVersion
        targetCompatibility = versions.javaVersion
    }
    kotlinOptions {
        jvmTarget = versions.javaVersion
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    // Godot Android library dependency
    implementation libraries.godotAndroidLib

    // Godot project dependencies
    implementation fileTree(dir: "godot/exportedAARs", include: ["**/*.jar", "*.aar"])
    implementation fileTree(dir: "godot/exportedAARs/aar_deps", include: ["**/*.jar", "*.aar"])

    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.fragment:fragment-ktx:1.9.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$versions.kotlinVersion"
}

// Provide the absolute path to the Godot editor binary
def godotBinary = ""

tasks.register("exportGodotProject", Exec) {
    doFirst {
        if (godotBinary.isEmpty()) {
            throw new GradleException("The path to the Godot editor binary was not specified.")
        }

        File godotBinaryFile = new File(godotBinary)
        if (!godotBinaryFile.exists()) {
            throw new GradleException("The path to the Godot editor binary is invalid: $godotBinary")
        }
    }

    description = "Export the embedded Godot project"
    workingDir file("godot")
    executable godotBinary
    args "--headless", "--export-release", "Android AAR", "exportedAARs/gltf_viewer_godot_project.aar"
}

afterEvaluate {
    tasks.named("preBuild").configure {
        dependsOn("exportGodotProject")
    }
}
